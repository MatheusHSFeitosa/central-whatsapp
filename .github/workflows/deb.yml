name: Pacote DEB (Pop!_OS e Ubuntu 22.04)
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependências gráficas e de teste
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv xvfb xauth libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0 libxcb-xkb1 libxkbcommon-x11-0 libnss3 libnspr4 libasound2 libdbus-1-3 libegl1 libgl1 libgbm1 libxcomposite1 libxdamage1 libxrandr2 libxtst6 libfontconfig1 libnotify-bin libglib2.0-0
          python3 -m venv build/test-env
          build/test-env/bin/python -m pip install -r requirements.txt
      - name: Verificar sintaxe e armazenamento isolado
        run: |
          build/test-env/bin/python -m py_compile central.py profile_store.py tests/smoke.py
          build/test-env/bin/python -m unittest discover -s tests -p 'test_*.py' -v
          for script in scripts/*.sh; do sh -n "$script"; done
      - name: Exercitar interface Qt sem login nem rede
        run: xvfb-run -a build/test-env/bin/python tests/smoke.py
      - name: Montar e inspecionar DEB
        run: |
          export CENTRAL_PYTHON_LIB="$(build/test-env/bin/python -c 'import sysconfig; print(sysconfig.get_paths()["purelib"])')"
          sh scripts/build-deb.sh
          dpkg-deb --info "dist/central-whatsapp_$(cat VERSION)_amd64.deb"
          test -f build/deb/opt/central-whatsapp/profile_store.py
          cmp VERSION build/deb/opt/central-whatsapp/VERSION
      - uses: actions/upload-artifact@v4
        with:
          name: central-whatsapp-deb
          path: dist/*.deb
