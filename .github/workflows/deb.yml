name: Pacote DEB (Pop!_OS e Ubuntu 22.04)
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependências gráficas e de teste
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv xvfb xauth libx11-xcb1 libxcb-shape0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0 libxcb-xkb1 libxkbcommon-x11-0 libnss3 libnspr4 libasound2 libdbus-1-3 libegl1 libgl1 libgbm1 libxcomposite1 libxdamage1 libxrandr2 libxtst6 libfontconfig1 libnotify-bin libglib2.0-0
          python3 -m venv build/test-env
          build/test-env/bin/python -m pip install -r requirements.txt
      - name: Verificar sintaxe e armazenamento isolado
        run: |
          build/test-env/bin/python -m py_compile central.py profile_store.py settings_store.py desktop_ui.py avatar_manager.py services.py tests/smoke.py tests/activation_smoke.py
          build/test-env/bin/python -m unittest discover -s tests -p 'test_*.py' -v
          for script in scripts/*.sh; do sh -n "$script"; done
      - name: Verificar bibliotecas nativas do Qt
        run: |
          build/test-env/bin/python - <<'PYQT'
          import subprocess
          from pathlib import Path
          import PySide6
          qt = Path(PySide6.__file__).parent / 'Qt'
          missing = False
          for path in [qt/'plugins/platforms/libqxcb.so', qt/'lib/libQt6XcbQpa.so.6', qt/'libexec/QtWebEngineProcess']:
              result = subprocess.run(['ldd', str(path)], capture_output=True, text=True)
              print(str(path), result.stdout, result.stderr, flush=True)
              if result.returncode or 'not found' in result.stdout:
                  missing = True
          if missing:
              raise SystemExit('Dependência nativa ausente no runtime Qt')
          PYQT
      - name: Exercitar interface Qt sem login nem rede
        env:
          QT_DEBUG_PLUGINS: '1'
        run: |
          xvfb-run -a build/test-env/bin/python tests/refined_ui_smoke.py
          xvfb-run -a build/test-env/bin/python tests/context_notifications_smoke.py
          xvfb-run -a build/test-env/bin/python tests/layout_smoke.py
          xvfb-run -a build/test-env/bin/python tests/services_smoke.py
          xvfb-run -a build/test-env/bin/python tests/smoke.py
          xvfb-run -a build/test-env/bin/python tests/activation_smoke.py
          xvfb-run -a build/test-env/bin/python tests/avatar_smoke.py
      - name: Montar e inspecionar DEB
        run: |
          export CENTRAL_PYTHON_LIB="$(build/test-env/bin/python -c 'import sysconfig; print(sysconfig.get_paths()["purelib"])')"
          sh scripts/build-deb.sh
          dpkg-deb --info "dist/central-whatsapp_$(cat VERSION)_amd64.deb"
          for module in central.py profile_store.py settings_store.py desktop_ui.py avatar_manager.py services.py; do test -f "build/deb/opt/central-whatsapp/$module"; done
          test -f build/deb/opt/central-whatsapp/check-symbolic.svg
          cmp VERSION build/deb/opt/central-whatsapp/VERSION
      - uses: actions/upload-artifact@v4
        with:
          name: central-whatsapp-deb
          path: dist/*.deb
