name: Linux amd64 — CEF e DEB
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Dependências gráficas e de teste
        run: |
          sudo apt-get update
          audio=libasound2; glib=libglib2.0-0
          if [ "${{ matrix.os }}" = ubuntu-24.04 ]; then audio=libasound2t64; glib=libglib2.0-0t64; fi
          sudo apt-get install -y g++ pkg-config libglib2.0-dev x11-apps x11-utils imagemagick python3-venv xvfb xauth openbox libx11-xcb1 libxcb-shape0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0 libxcb-xkb1 libxkbcommon-x11-0 libnss3 libnspr4 "$audio" libdbus-1-3 libegl1 libgl1 libgbm1 libxcomposite1 libxdamage1 libxrandr2 libxtst6 libfontconfig1 libnotify-bin "$glib"
          python3 -m venv build/test-env
          build/test-env/bin/python -m pip install -r requirements-dev.txt
      - name: Preparar motor CEF fixado
        run: python3 scripts/prepare-cef.py
      - name: Exercitar motor CEF com mídia e perfis fictícios
        env:
          QT_QPA_PLATFORM: xcb
          CENTRAL_CEF_RUNTIME: ${{ github.workspace }}/build/cef-runtime
        run: |
          sh scripts/test-qt-ci.sh build/test-env/bin/python tests/cef_native_events_smoke.py
          sh scripts/test-qt-ci.sh build/test-env/bin/python tests/cef_smoke.py
          sh scripts/test-qt-ci.sh build/test-env/bin/python tests/cef_window_smoke.py
          sh scripts/test-qt-ci.sh build/test-env/bin/python tests/cef_split_smoke.py
          sh scripts/test-qt-ci.sh build/test-env/bin/python tests/cef_chrome_smoke.py
      - name: Verificar sintaxe e armazenamento isolado
        run: |
          build/test-env/bin/python -m py_compile split_workspace.py window_chrome.py cef_engine.py cef_storage.py central.py ui_widgets.py desktop_notifications.py grouping.py profile_store.py settings_store.py desktop_ui.py avatar_manager.py services.py tests/smoke.py tests/activation_smoke.py
          build/test-env/bin/python -m unittest discover -s tests -p 'test_*.py' -v
          for script in scripts/*.sh; do sh -n "$script"; done
      - name: Verificar bibliotecas nativas do Qt
        run: |
          build/test-env/bin/python - <<'PYQT'
          import subprocess
          from pathlib import Path
          import PySide6
          qt = Path(PySide6.__file__).parent / 'Qt'
          missing = False
          for path in [qt/'plugins/platforms/libqxcb.so', qt/'lib/libQt6XcbQpa.so.6', qt/'libexec/QtWebEngineProcess']:
              result = subprocess.run(['ldd', str(path)], capture_output=True, text=True)
              print(str(path), result.stdout, result.stderr, flush=True)
              if result.returncode or 'not found' in result.stdout:
                  missing = True
          if missing:
              raise SystemExit('Dependência nativa ausente no runtime Qt')
          PYQT
      - name: Exercitar interface Qt sem login nem rede
        env:
          CENTRAL_BROWSER_ENGINE: qt-test
          QT_DEBUG_PLUGINS: '1'
          QTWEBENGINE_CHROMIUM_FLAGS: '--disable-gpu'
        run: |
          sh scripts/test-qt-ci.sh build/test-env/bin/python tests/custom_profiles_smoke.py
          sh scripts/test-qt-ci.sh build/test-env/bin/python tests/webrtc_smoke.py
          sh scripts/test-qt-ci.sh build/test-env/bin/python tests/theme_dialogs_smoke.py
          sh scripts/test-qt-ci.sh build/test-env/bin/python tests/group_management_smoke.py
          sh scripts/test-qt-ci.sh build/test-env/bin/python tests/local_features_smoke.py
          sh scripts/test-qt-ci.sh build/test-env/bin/python tests/media_smoke.py
          sh scripts/test-qt-ci.sh build/test-env/bin/python tests/refined_ui_smoke.py
          sh scripts/test-qt-ci.sh build/test-env/bin/python tests/context_notifications_smoke.py
          sh scripts/test-qt-ci.sh build/test-env/bin/python tests/layout_smoke.py
          sh scripts/test-qt-ci.sh build/test-env/bin/python tests/services_smoke.py
          sh scripts/test-qt-ci.sh build/test-env/bin/python tests/smoke.py
          sh scripts/test-qt-ci.sh build/test-env/bin/python tests/activation_smoke.py
          sh scripts/test-qt-ci.sh build/test-env/bin/python tests/avatar_smoke.py
      - name: Montar e inspecionar DEB
        if: matrix.os == 'ubuntu-22.04'
        run: |
          export CENTRAL_PYTHON_LIB="$(build/test-env/bin/python -c 'import sysconfig; print(sysconfig.get_paths()["purelib"])')"
          sh scripts/build-deb.sh
          dpkg-deb --info "dist/central-whatsapp_$(cat VERSION)_amd64.deb"
          for module in split_workspace.py window_chrome.py cef_engine.py cef_storage.py central.py ui_widgets.py desktop_notifications.py grouping.py profile_store.py settings_store.py desktop_ui.py avatar_manager.py services.py; do test -f "build/deb/opt/central-whatsapp/$module"; done
          test -f build/deb/opt/central-whatsapp/check-symbolic.svg
          cmp VERSION build/deb/opt/central-whatsapp/VERSION
      - name: Anexar pacote à versão
        if: matrix.os == 'ubuntu-22.04'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_tag="v$(cat VERSION)"
          if [ "$(gh release view "$release_tag" --json isDraft --jq .isDraft 2>/dev/null || true)" = true ]; then
            sha256sum "dist/central-whatsapp_$(cat VERSION)_amd64.deb" | sed 's|dist/||' > dist/SHA256SUMS
            gh release upload "$release_tag" "dist/central-whatsapp_$(cat VERSION)_amd64.deb" dist/SHA256SUMS --clobber
          fi
